# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
'on':
  pull_request:
    branches:
      - main
jobs:
  build_and_preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    # The repo's default GITHUB_TOKEN is read-only, which made every run of
    # this workflow fail with "Resource not accessible by integration" when
    # action-hosting-deploy tries to create a "Deploy Preview" check run and
    # comment on the PR — pre-existing on every PR going back well before
    # this branch (see the workflow's run history). Grant just what that
    # action needs.
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - run: npm ci

      - name: Block on crash-causing lint errors
        run: npm run lint:critical

      - name: Unit tests
        run: npm test

      # The Firebase emulator runs on the JVM, and firebase-tools requires
      # Java 21+. The runner's default JDK is older, which failed the rules
      # tests with "firebase-tools no longer supports Java version before 21".
      - name: Set up Java for the Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Security rules tests
        run: npx -y firebase-tools emulators:exec --only firestore,storage --project memeclassroom-rules-test "npx vitest run tests/rules"
        env:
          JAVA_TOOL_OPTIONS: ""

      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEMECLASSROOM_98D2B }}'
          projectId: memeclassroom-98d2b
