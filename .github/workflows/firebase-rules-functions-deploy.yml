name: Deploy Firestore & Storage Rules and Cloud Functions

# Runs automatically whenever rules or functions code lands on main (i.e.
# whenever a PR touching them is merged) — no manual `firebase deploy` needed.
# Hosting (the built frontend) is deployed separately by
# firebase-hosting-merge.yml; this workflow covers Firestore rules, Firestore
# indexes, Storage rules and Cloud Functions.
#
# storage.rules used to be deployable ONLY by running deploy.bat by hand on a
# Windows machine, so the locked-down rules in the repo could silently differ
# from what was live. Likewise firestore.indexes.json was never deployed, so
# composite indexes existed only if someone created them in the Console.
# Both are now part of this workflow.
on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'functions/**'
      - '.github/workflows/firebase-rules-functions-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}'

      # --force sets up the Cloud Run image cleanup policy without prompting.
      # Without it the deploy does all its work, then exits 1 with "Functions
      # successfully deployed but could not set up cleanup policy in location
      # <region>" the first time functions land in a region that has no policy
      # yet — which is how this job went red while rules, indexes and every
      # function had in fact deployed. The policy also stops old container
      # images accumulating and quietly adding to the bill.
      #
      # Note: --force also means functions removed from functions/index.js are
      # deleted without a confirmation prompt. That is what we want from CI,
      # where the source is the single source of truth.
      # Rules and indexes deploy FIRST, in their own step. They are the security
      # boundary and have no external dependencies, so they must not be held
      # hostage by the functions half. A Storage-triggered function needs a
      # one-time project-owner IAM grant (Pub/Sub Publisher for the Cloud
      # Storage service agent); until that exists the functions deploy aborts
      # during preparation — which previously happened BEFORE the rules were
      # released, so a rules change silently failed to go live.
      - name: Deploy Firestore rules, indexes and Storage rules
        run: npx -y firebase-tools deploy --only firestore:rules,firestore:indexes,storage --project memeclassroom-98d2b --force

      - name: Deploy Cloud Functions
        run: npx -y firebase-tools deploy --only functions --project memeclassroom-98d2b --force
